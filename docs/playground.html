<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Configure Gessi components and copy the generated HTML.">
    <title>Gessi component playground</title>
    <link rel="stylesheet" href="../dist/gessi.css" data-gessi-styles>
    <link rel="stylesheet" href="./docs.css">
    <script type="module" src="../dist/gessi.js"></script>
    <script type="module" src="./docs.js"></script>
  </head>
  <body class="docs-playground-page">
    <header class="docs-topbar docs-playground-topbar">
      <a class="docs-brand" href="./" aria-label="Gessi documentation home">
        <span aria-hidden="true">▰</span>
        <strong>gessi</strong>
        <small>playground</small>
      </a>
      <nav class="docs-topnav" aria-label="Project links">
        <a href="./">Documentation</a>
        <a href="./reference.md">Plain docs</a>
        <a href="https://www.npmjs.com/package/@pol-cova/gessi">npm</a>
        <a href="https://github.com/pol-cova/gessi">GitHub</a>
      </nav>
    </header>

    <main class="docs-standalone-main">
      <section class="docs-section" data-doc-page="playground generator window desktop media snippet">
        <header class="docs-heading">
          <span>Component playground</span>
          <div>
            <h1>Build a component, then copy the HTML.</h1>
            <p>Choose a window, media frame, or desktop. The preview and snippet update together, so the result is ready to paste into a real page.</p>
          </div>
        </header>

        <div class="docs-playground" data-playground>
          <div class="docs-playground-tabs" role="tablist" aria-label="Playground component">
            <button type="button" role="tab" aria-selected="true" data-playground-tab="window">Window</button>
            <button type="button" role="tab" aria-selected="false" data-playground-tab="media">Media</button>
            <button type="button" role="tab" aria-selected="false" data-playground-tab="desktop">Desktop</button>
          </div>
          <div class="docs-playground-layout">
            <form class="docs-playground-controls" data-playground-controls>
              <div data-playground-panel="window">
                <label>Title <input name="window-title" value="Projects"></label>
                <label>Width <select name="window-width"><option value="22rem">Compact</option><option value="32rem" selected>Standard</option><option value="42rem">Wide</option></select></label>
                <label><input name="window-minimizable" type="checkbox" checked> Include minimize control</label>
                <label><input name="window-zoomable" type="checkbox" checked> Include zoom control</label>
                <label>Theme <select name="window-theme"><option value="classic-os">Classic OS</option><option value="old-tech">Old-tech</option><option value="neo">Neo</option></select></label>
              </div>
              <div data-playground-panel="media" hidden>
                <label>Effect <select name="media-effect"><option value="pixel">Pixel</option><option value="dither">Dither</option><option value="blueprint scanlines">Blueprint + scanlines</option><option value="glitch crt">Glitch + CRT</option></select></label>
                <label>Frame <select name="media-frame"><option value="window">Window</option><option value="polaroid">Polaroid</option><option value="none">None</option></select></label>
                <label>Aspect ratio <select name="media-aspect"><option value="1 / 1">Square</option><option value="4 / 3" selected>4:3</option><option value="16 / 9">16:9</option></select></label>
                <label>Fit <select name="media-fit"><option value="cover">Cover</option><option value="contain">Contain</option></select></label>
                <label>Theme <select name="media-theme"><option value="classic-os">Classic OS</option><option value="old-tech">Old-tech</option><option value="neo">Neo</option></select></label>
              </div>
              <div data-playground-panel="desktop" hidden>
                <label>Pattern <select name="desktop-pattern"><option value="grid">Grid</option><option value="dots">Dots</option><option value="checker">Checker</option></select></label>
                <label>Background <input name="desktop-background" type="color" value="#c5c9ea"></label>
                <label>Pattern color <input name="desktop-pattern-color" type="color" value="#5a5f92"></label>
                <label>Menu <input name="desktop-menu" value="⌘ Gessi,File,Edit,Help"></label>
                <label><input name="desktop-icons" type="checkbox" checked> Include desktop icons</label>
                <label>Theme <select name="desktop-theme"><option value="classic-os">Classic OS</option><option value="old-tech">Old-tech</option><option value="neo">Neo</option></select></label>
              </div>
            </form>
            <div class="docs-playground-preview" data-playground-preview></div>
          </div>
          <div class="docs-code" data-playground-code data-copy-block>
            <button type="button" data-copy>Copy HTML</button>
            <pre><code></code></pre>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
