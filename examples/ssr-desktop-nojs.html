<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gessi SSR desktop first paint (no JS)</title>
    <link rel="stylesheet" href="../dist/gessi.css" data-gessi-styles>
  </head>
  <body>
    <gessi-desktop theme="classic-os" background="#98d7c2" pattern="noise">
      <gessi-window title="Hello" width="20rem">
        <p>First paint should match this theme before JavaScript runs.</p>
      </gessi-window>
    </gessi-desktop>
  </body>
</html>
